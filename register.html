<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب مريض — HealthConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="main-container register-wrap">
      <header class="header-section">
        <div class="logo"><i class="fa-solid fa-user-plus" aria-hidden="true"></i></div>
        <h1>تسجيل مريض جديد</h1>
        <p>أنشئ حسابك لمتابعة المواعيد وملفك الصحي</p>
      </header>

      <div class="login-card">
        <form id="register-form" novalidate>
          <div class="input-group">
            <label for="full-name">الاسم الكامل</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user" aria-hidden="true"></i>
              <input id="full-name" name="full-name" type="text" autocomplete="name" placeholder="الاسم رباعي" required />
            </div>
          </div>

          <div class="input-group">
            <label for="email">البريد الإلكتروني</label>
            <div class="input-wrapper">
              <i class="far fa-envelope" aria-hidden="true"></i>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
            </div>
          </div>

          <div class="input-group">
            <label for="phone">رقم الجوال</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-phone" aria-hidden="true"></i>
              <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="مثال: 05xxxxxxxx" />
            </div>
          </div>

          <div class="input-group">
            <label for="password">كلمة المرور</label>
            <div class="input-wrapper">
              <i class="fas fa-lock" aria-hidden="true"></i>
              <input id="password" name="password" type="password" autocomplete="new-password" placeholder="6 أحرف على الأقل" required minlength="6" />
            </div>
          </div>

          <div class="input-group">
            <label for="confirm">تأكيد كلمة المرور</label>
            <div class="input-wrapper">
              <i class="fas fa-lock" aria-hidden="true"></i>
              <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="أعد إدخال كلمة المرور" required />
            </div>
          </div>

          <div id="form-message" class="form-message" role="alert"></div>

          <button type="submit" class="login-btn">إنشاء الحساب</button>
        </form>

        <p class="auth-switch">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
      </div>

      <footer class="footer-links">
        <a href="index.html">الرئيسية</a>
        <a href="login.html">دخول الأدمن / الطبيب</a>
      </footer>
    </div>

    <script src="js/patients-store.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
