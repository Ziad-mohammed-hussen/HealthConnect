<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول — HealthConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="main-container">
      <header class="header-section">
        <div class="logo"><i class="fa-solid fa-heart-pulse" aria-hidden="true"></i></div>
        <h1>هيلث كونيكت</h1>
        <p>صحتك، بضغطة زر واحدة</p>
      </header>

      <div class="login-card">
        <h2 style="font-size: 1.1rem; margin-bottom: 1rem; color: #333">تسجيل الدخول</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 1rem; line-height: 1.5">
          <strong>مريض:</strong> البريد وكلمة المرور اللذان سجّلت بهما.<br />
          <strong>أدمن / طبيب:</strong> الحسابات التجريبية الثابتة كما في الأسفل.
        </p>

        <form id="login-form" novalidate>
          <div class="input-group">
            <label for="role">نوع المستخدم</label>
            <select id="role" name="role" required>
              <option value="patient">مريض</option>
              <option value="admin">مدير النظام (أدمن)</option>
              <option value="doctor">طبيب</option>
            </select>
          </div>

          <div class="input-group">
            <label for="email">البريد الإلكتروني</label>
            <div class="input-wrapper">
              <i class="far fa-envelope" aria-hidden="true"></i>
              <input id="email" name="email" type="email" autocomplete="username" placeholder="name@example.com" required />
            </div>
          </div>

          <div class="input-group">
            <label for="password">كلمة المرور</label>
            <div class="input-wrapper">
              <i class="fas fa-lock" aria-hidden="true"></i>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
            </div>
          </div>

          <div id="form-message" class="form-message" role="alert"></div>

          <button type="submit" class="login-btn">دخول</button>
        </form>
      </div>

      <footer class="footer-links">
        <a href="index.html">الرئيسية</a>
        <a href="register.html">إنشاء حساب مريض</a>
      </footer>

      <p class="auth-switch" style="margin-top: 8px">ليس لديك حساب؟ <a href="register.html">سجّل كمريض</a></p>
    </div>

    <script src="js/patients-store.js"></script>
    <script src="js/staff-store.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
